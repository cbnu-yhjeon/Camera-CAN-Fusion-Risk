<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Near-miss 검수</title>
<style>
:root{--bg:#f7f7f5;--fg:#1d1d1b;--card:#fff;--muted:#6b6b66;--line:#ddd;--yes:#17803d;--no:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ecece8;--card:#222220;--muted:#a3a39c;--line:#3a3a37}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:0 0 16px;overflow:hidden}
.card img{width:100%;display:block}.meta{padding:10px 14px;color:var(--muted);font-size:13px}
.btns{display:flex;gap:8px;padding:0 14px 12px}button{font:inherit;padding:6px 14px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.card[data-v="1"]{border-color:var(--yes);box-shadow:0 0 0 2px var(--yes)}.card[data-v="0"]{border-color:var(--no);box-shadow:0 0 0 2px var(--no)}
</style></head><body>
<header><b>Near-miss 후보 검수</b><span id="cnt"></span><button id="exp">goldset.json 내보내기</button></header>
<main id="list"></main>
<script>
const EV=[{"event_id": "scene-0003_f1_1533201487.61", "scene": "scene-0003", "t_start": 1533201487.61246, "t_end": 1533201487.61246, "cls": "pedestrian", "min_ttc": 1.462612181202275, "matched_auto": false, "img": "scene-0003_f1_1533201487.61.jpg"}, {"event_id": "scene-0017_f1_1531885780.16", "scene": "scene-0017", "t_start": 1531885780.16246, "t_end": 1531885780.512464, "cls": "pedestrian", "min_ttc": 0.9581292124163309, "matched_auto": false, "img": "scene-0017_f1_1531885780.16.jpg"}, {"event_id": "scene-0185_f1_1532663016.11", "scene": "scene-0185", "t_start": 1532663016.11246, "t_end": 1532663016.11246, "cls": "pedestrian", "min_ttc": 0.6990823308994489, "matched_auto": false, "img": "scene-0185_f1_1532663016.11.jpg"}, {"event_id": "scene-0212_f1_1532622066.26", "scene": "scene-0212", "t_start": 1532622066.262404, "t_end": 1532622067.262404, "cls": "truck", "min_ttc": 0.272437448408658, "matched_auto": true, "img": "scene-0212_f1_1532622066.26.jpg"}, {"event_id": "scene-0221_f1_1531713383.76", "scene": "scene-0221", "t_start": 1531713383.76246, "t_end": 1531713383.76246, "cls": "car", "min_ttc": 1.4938793598248736, "matched_auto": true, "img": "scene-0221_f1_1531713383.76.jpg"}, {"event_id": "scene-0238_f1_1532708643.51", "scene": "scene-0238", "t_start": 1532708643.512404, "t_end": 1532708643.762404, "cls": "pedestrian", "min_ttc": 0.6582942050043792, "matched_auto": false, "img": "scene-0238_f1_1532708643.51.jpg"}, {"event_id": "scene-0349_f1_1533202360.26", "scene": "scene-0349", "t_start": 1533202360.26246, "t_end": 1533202360.36246, "cls": "car", "min_ttc": 1.3383274686476003, "matched_auto": false, "img": "scene-0349_f1_1533202360.26.jpg"}, {"event_id": "scene-0649_f1_1537296534.41", "scene": "scene-0649", "t_start": 1537296534.412404, "t_end": 1537296534.512404, "cls": "car", "min_ttc": 1.290249459855854, "matched_auto": true, "img": "scene-0649_f1_1537296534.41.jpg"}, {"event_id": "scene-0695_f1_1535573067.76", "scene": "scene-0695", "t_start": 1535573067.762404, "t_end": 1535573067.762404, "cls": "car", "min_ttc": 1.4677306887154702, "matched_auto": true, "img": "scene-0695_f1_1535573067.76.jpg"}, {"event_id": "scene-0945_f1_1537931870.91", "scene": "scene-0945", "t_start": 1537931870.91246, "t_end": 1537931871.01246, "cls": "car", "min_ttc": 1.0578323613802028, "matched_auto": false, "img": "scene-0945_f1_1537931870.91.jpg"}, {"event_id": "scene-0959_f1_1537932296.51", "scene": "scene-0959", "t_start": 1537932296.51246, "t_end": 1537932296.51246, "cls": "motorcycle", "min_ttc": 1.4686067221754338, "matched_auto": false, "img": "scene-0959_f1_1537932296.51.jpg"}, {"event_id": "scene-0966_f1_1537852860.76", "scene": "scene-0966", "t_start": 1537852860.76246, "t_end": 1537852861.91246, "cls": "car", "min_ttc": 0.670899067480535, "matched_auto": true, "img": "scene-0966_f1_1537852860.76.jpg"}, {"event_id": "scene-1051_f1_1542798868.26", "scene": "scene-1051", "t_start": 1542798868.26246, "t_end": 1542798869.36246, "cls": "car", "min_ttc": 1.1567103984630642, "matched_auto": false, "img": "scene-1051_f1_1542798868.26.jpg"}, {"event_id": "scene-1102_f1_1542801265.91", "scene": "scene-1102", "t_start": 1542801265.91246, "t_end": 1542801265.91246, "cls": "car", "min_ttc": 0.7834699945749464, "matched_auto": false, "img": "scene-1102_f1_1542801265.91.jpg"}, {"event_id": "scene-1104_f1_1542801289.86", "scene": "scene-1104", "t_start": 1542801289.86246, "t_end": 1542801290.16246, "cls": "pedestrian", "min_ttc": 0.5442572748626644, "matched_auto": false, "img": "scene-1104_f1_1542801289.86.jpg"}];const KEY="nearmiss-gold-v1";let lab={};try{lab=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(lab))}catch(e){}count()}
function count(){const n=Object.keys(lab).length;document.getElementById("cnt").textContent=`${n} / ${EV.length} 검수`}
const L=document.getElementById("list");
for(const e of EV){const c=document.createElement("div");c.className="card";c.dataset.v=lab[e.event_id]??"";
c.innerHTML=`<img loading="lazy" src="img/${e.img}" alt=""><div class="meta">${e.scene} · ${e.t_start.toFixed(1)}–${e.t_end.toFixed(1)} s · ${e.cls} · 최소 TTC ${e.min_ttc.toFixed(2)} s · 자동 기준 일치: ${e.matched_auto?"예":"아니오"}</div><div class="btns"><button data-a="1">위험했다</button><button data-a="0">아니다</button></div>`;
c.querySelectorAll("button").forEach(b=>b.onclick=()=>{lab[e.event_id]=+b.dataset.a;c.dataset.v=b.dataset.a;save()});L.appendChild(c)}
document.getElementById("exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(lab,null,1)],{type:"application/json"}));a.download="goldset.json";a.click()};
count();
</script></body></html>
